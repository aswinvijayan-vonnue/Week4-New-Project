<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./index.css" />
    <script src="./js/components.js"></script>
    <title>Document</title>
  </head>
  <body>
    <div class="heroSection">
      <h1>Full Movie Library</h1>
      <button>Add Movie</button>
    </div>
    <div class="overlay">
      <div class="form-container">
        <div class="formHead">
          <h3>Add Movie to the list</h3>
          <button class="close-but">X</button>
        </div>
        <form action="">
          <div class="input-container">
            <label for="movieName">Movie Name</label>
            <input type="text" id="movieName" placeholder="Movie Name" name="movie" required />
          </div>
          <div class="input-container">
            <label for="director">Director</label>
            <input type="text" id="director" name="year" placeholder="Director Name" />
          </div>
          <div class="input-container">
            <label for="year">Year</label>
            <input type="number" min="1800" />
          </div>
          <div class="input-container">
            <textarea
              name="description"
              id="description"
              placeholder="Describe your movie"
            ></textarea>
          </div>
          <div></div>
          <div class="input-container">
            <button type="submit" class="add-but">Add Movie</button>
          </div>
        </form>
      </div>
    </div>
    <div class="movies-container">
      <div class="movie">
        <img
          src="https://d1csarkz8obe9u.cloudfront.net/posterpreviews/adventure-movie-poster-template-design-7b13ea2ab6f64c1ec9e1bb473f345547_screen.jpg?ts=1636999411"
          alt=""
        />
        <p class="movieName">A Night in Casablanca</p>
        <p class="movieYear">1989</p>
      </div>
      <div class="movie">
        <img
          src="https://d1csarkz8obe9u.cloudfront.net/posterpreviews/adventure-movie-poster-template-design-7b13ea2ab6f64c1ec9e1bb473f345547_screen.jpg?ts=1636999411"
          alt=""
        />
        <p class="movieName">A Day at the Races</p>
        <p class="movieYear">1937</p>
      </div>
      <div class="movie">
        <img
          src="https://d1csarkz8obe9u.cloudfront.net/posterpreviews/adventure-movie-poster-template-design-7b13ea2ab6f64c1ec9e1bb473f345547_screen.jpg?ts=1636999411"
          alt=""
        />
        <p class="movieName">A Night in Casablanca</p>
        <p class="movieYear">1989</p>
      </div>
    </div>
  </body>
</html>
